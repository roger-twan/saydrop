[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "saydrop-server"
version = "0.1.0"
description = "Saydrop single-worker transcription backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "pydantic==2.14.1", "httpx==0.28.1",
  "sqlalchemy==2.1.6", "uvicorn==0.54.0", "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "ruff==0.17.2"]

[tool.hatch.build.targets.wheel]
packages = ["saydrop_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
